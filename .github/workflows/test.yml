name: Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    - name: Build
      run: go build -v .
    - name: Test
      run: go test -coverprofile=coverage.out -covermode=atomic -v .
